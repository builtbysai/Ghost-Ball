name: Ghost Ball checks
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ghostball-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          find src -name '*.js' -exec node --check {} \;
      - name: Simulation and rules unit tests
        run: npm test
      - name: Browser smoke dependencies
        if: github.event_name == 'pull_request'
        run: python3 -m pip install playwright
      - name: Responsive browser smoke and screenshots
        if: github.event_name == 'pull_request'
        env:
          CHROMIUM_BIN: /usr/bin/google-chrome
        run: python3 scripts/landscape-smoke.py
      - name: Save viewport screenshots
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: ghost-ball-viewports
          path: |
            screenshots/
            src/
            tests/
            scripts/
            index.html
            package.json
            sw.js
            manifest.webmanifest
          if-no-files-found: ignore
