name: Ghost Ball checks
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ghostball-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          find src -name '*.js' -exec node --check {} \;
          node --check scripts/full-rack-lab.mjs
      - name: Simulation and rules unit tests
        run: npm test
      - name: Headless full-rack AI and rules baseline
        if: github.event_name == 'pull_request'
        env:
          GHOST_SEEDS: "17,41,73,109,211,337"
          GHOST_MAX_SHOTS: "120"
          GHOST_REPLAY: "1"
          GHOST_SEAT_FLIP_SEEDS: "17,41,73"
          GHOST_MIN_LEGAL_FINISHES: "9"
        run: |
          node scripts/full-rack-lab.mjs > full-rack-report.json
          cat full-rack-report.json
      - name: Archive full-rack baseline
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: ghost-ball-full-rack-baseline
          path: full-rack-report.json
          if-no-files-found: ignore
      - name: Browser smoke dependencies
        if: github.event_name == 'pull_request'
        run: python3 -m pip install playwright
      - name: Responsive browser smoke and screenshots
        if: github.event_name == 'pull_request'
        env:
          CHROMIUM_BIN: /usr/bin/google-chrome
        run: python3 scripts/landscape-smoke.py
      - name: Foul placement interaction and responsive screenshots
        if: github.event_name == 'pull_request'
        env:
          CHROMIUM_BIN: /usr/bin/google-chrome
        run: python3 scripts/p1-interaction-smoke.py
      - name: Referee and local two-player responsive match browser smoke
        if: github.event_name == 'pull_request'
        env:
          CHROMIUM_BIN: /usr/bin/google-chrome
        run: python3 scripts/p2-rules-smoke.py
      - name: Real HTTP module and cache-busting smoke
        if: github.event_name == 'pull_request'
        env:
          CHROMIUM_BIN: /usr/bin/google-chrome
        run: python3 scripts/http-smoke.py
      - name: Save viewport screenshots
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: ghost-ball-viewports
          path: screenshots/
          if-no-files-found: ignore
