<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>Ghost Ball</title>
<meta name="description" content="A browser pool game with real spin and throw physics, five halls from pool's history, a career Circuit, trick shots and a daily run. Nothing to buy, nothing to wait for.">
<meta name="theme-color" content="#0e0b08">
<meta name="color-scheme" content="dark">
<link rel="icon" type="image/svg+xml" href="./assets/icon.svg">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./assets/icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./src/styles.css">
</head>
<body>
<canvas id="game"></canvas>

<div id="hud" class="hidden">
  <div class="hud-l"><div class="tag" id="tagA"><i class="av"></i><div class="tx"><b class="pname"></b><em class="pgroup"></em></div><div class="tray"></div></div></div>
  <div class="hud-c"><div class="modeTag"></div><div class="status" id="status"></div><div class="netchip hidden" id="netchip"><i></i><em>-- ms</em></div></div>
  <div class="hud-r">
    <div class="tag" id="tagB"><i class="av"></i><div class="tx"><b class="pname"></b><em class="pgroup"></em></div><div class="tray"></div></div>
    <div class="btns">
      <button class="iconbtn hidden" id="btnReplay" title="Replay last shot (R)" aria-label="Replay last shot"><svg viewBox="0 0 24 24"><path d="M12 5V2L7 6l5 4V7a5 5 0 1 1-5 5H5a7 7 0 1 0 7-7z"/></svg></button>
      <button class="iconbtn hidden" id="btnHint" title="Show me" aria-label="Show me the solution"><svg viewBox="0 0 24 24"><path d="M9 21h6v-1H9zm3-19a7 7 0 0 0-4 12.7V17h8v-2.3A7 7 0 0 0 12 2z"/></svg></button>
      <button class="iconbtn hidden" id="btnRerack" title="Re-rack" aria-label="Re-rack"><svg viewBox="0 0 24 24"><path d="M12 3 2 21h20zm0 6 5.5 10h-11z"/></svg></button>
      <button class="iconbtn hidden" id="btnEmote" title="Say something" aria-label="Quick chat"><svg viewBox="0 0 24 24"><path d="M4 4h16v12H8l-4 4z"/></svg></button>
      <button class="iconbtn" id="btnFull" title="Fullscreen (F)" aria-label="Toggle fullscreen"><svg viewBox="0 0 24 24"><path d="M4 4h6v2H6v4H4zm10 0h6v6h-2V6h-4zM4 14h2v4h4v2H4zm14 0h2v6h-6v-2h4z"/></svg></button>
      <button class="iconbtn" id="btnSound" title="Mute (M)" aria-label="Mute all audio"><svg viewBox="0 0 24 24"><path d="M3 10v4h4l5 4V6L7 10zm13.5 2a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4z"/></svg></button>
      <button class="iconbtn" id="btnPause" title="Pause (P)" aria-label="Pause"><svg viewBox="0 0 24 24"><path d="M7 5h4v14H7zm6 0h4v14h-4z"/></svg></button>
    </div>
  </div>
</div>

<div id="emotePanel" class="hidden"></div>
<div id="callouts" aria-live="polite"></div>
<div id="banner" class="hidden" role="status" aria-live="polite"><b></b><span></span></div>
<div id="hint" class="hidden"></div>

<div id="spinWidget" class="hidden" aria-label="Cue ball spin and English">
  <div class="spinTop">
    <button class="jumpbtn" id="jumpBtn" aria-label="Cue elevation for jump shots. Tap to cycle." title="Jump (J)">JUMP <b>OFF</b></button>
    <div class="ball"><i class="shine"></i><i class="ring r1"></i><i class="ring r2"></i><i class="dot"></i></div>
    <div class="spinMeta"><span class="spinCap">ENGLISH</span><span class="spinSub">strike point</span></div>
  </div>
  <div class="nudge"><button id="nudgeL" aria-label="Nudge aim left">&#8249;</button><span>FINE AIM</span><button id="nudgeR" aria-label="Nudge aim right">&#8250;</button></div>
</div>
<div id="powerStrip" class="hidden" aria-label="Shot power">
  <div class="pCap">POWER</div>
  <div class="track"><div class="fill"></div><div class="segs"></div><div class="handle"><em>POWER</em></div></div>
</div>
<button id="btnPlace" class="hidden">PLACE CUE BALL</button>

<div id="menuRoot" class="menuRoot">
  <div class="menuL" id="menuPanel"></div>
</div>

<div class="overlay hidden" id="modal"><div class="sheet" id="modalSheet"></div></div>

<script type="module" src="./src/main.js"></script>
</body>
</html>
